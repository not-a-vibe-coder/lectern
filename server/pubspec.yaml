name: lectern_server
description: Server for Lectern. Serves the web app, stores shelf metadata in SQLite and lists Walrus blobs that reps stored with their own wallet.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
dependencies:
  http: ^1.6.0
  mime: ^2.1.0
  path: ^1.9.1
  qr: ^4.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^3.7.1
  sui_auth:
    path: ../packages/sui_auth
  walrus_blob_check:
    path: ../packages/walrus_blob_check
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
